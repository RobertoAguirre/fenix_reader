name: fenix_reader
description: "Fenix Reader - App de meditación y contenido"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # Networking
  http: ^1.1.0
  
  # Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.3.2
  path_provider: ^2.1.5
  
  # Video
  video_player: ^2.10.0
  chewie: ^1.7.0
  
  # Audio
  audioplayers: ^5.2.0
  audio_service: ^0.18.12
  just_audio: ^0.9.36
  
  # Images
  cached_network_image: ^3.3.0
  
  # UI
  shimmer: ^3.0.0
  google_fonts: ^6.1.0
  
  # State Management
  provider: ^6.1.0
  
  # Navigation
  go_router: ^12.0.0
  
  # Utils
  url_launcher: ^6.3.2
  connectivity_plus: ^7.0.0
  
  # IAP
  in_app_purchase: ^3.1.11
  
  # SDKs que requieren Privacy Manifest (explícitos para asegurar versiones recientes)
  package_info_plus: ^9.0.0
  sqflite: ^2.4.2
  wakelock_plus: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
